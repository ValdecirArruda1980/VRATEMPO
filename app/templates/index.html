<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRATEMPO GLOBAL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1e293b; border-bottom: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .card h4 { margin: 0 0 10px 0; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
        .card .val { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
        .card .sub { font-size: 0.75rem; color: #38bdf8; margin-top: 5px; font-weight: 600; }
        #chart-container { background: #1e293b; margin: 0 20px 20px 20px; padding: 15px; border-radius: 10px; border: 1px solid #334155; height: 180px; }
        
        .map-wrapper { margin: 0 20px 20px 20px; border-radius: 10px; overflow: hidden; border: 1px solid #334155; background: #1e293b; }
        .map-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; }
        .selected-city-banner { background: #0284c7; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; }
        
        .layer-selector { display: flex; gap: 8px; flex-wrap: wrap; }
        .layer-btn { background: #0f172a; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500; }
        .layer-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
        
        iframe#ventusky-map { width: 100%; height: 650px; border: none; display: block; }
        .search-box input { width: 280px; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
    </style>
</head>
<body>

<div class="header">
    <h2>🌪️ VRATEMPO GLOBAL</h2>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar qualquer cidade..." onkeypress="if(event.key==='Enter') searchLocation()">
    </div>
    <button onclick="getLocation()" style="background:#0284c7; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer;">📍 Minha Localização</button>
</div>

<div class="grid">
    <div class="card">
        <h4>Temperatura</h4>
        <div class="val" id="temp">--°C</div>
        <div class="sub" id="location-name">Piracicaba, SP</div>
    </div>
    <div class="card">
        <h4>Vento / Rajadas</h4>
        <div class="val" id="wind">-- km/h</div>
        <div class="sub" id="wind-sub">--</div>
    </div>
    <div class="card">
        <h4>Chuva / Acumulado</h4>
        <div class="val" id="rain">0.0 mm</div>
        <div class="sub">Sem chuva</div>
    </div>
    <div class="card">
        <h4>CAPE (Instabilidade)</h4>
        <div class="val" id="cape">-- J/kg</div>
        <div class="sub">Estável</div>
    </div>
    <div class="card">
        <h4>Pressão Atmosférica</h4>
        <div class="val" id="pressure">-- hPa</div>
        <div class="sub">Superfície</div>
    </div>
</div>

<div id="chart-container">
    <canvas id="forecastChart"></canvas>
</div>

<div class="map-wrapper">
    <div class="map-header">
        <span class="selected-city-banner" id="banner-city">📍 Cidade Selecionada: Piracicaba, SP</span>
        <div class="layer-selector">
            <button class="layer-btn active" onclick="changeMapLayer('rain')">🌧️ Chuva / Radar</button>
            <button class="layer-btn" onclick="changeMapLayer('temperature')">🌡️ Temperatura (Calor/Frio)</button>
            <button class="layer-btn" onclick="changeMapLayer('wind-10m')">💨 Ventos</button>
            <button class="layer-btn" onclick="changeMapLayer('clouds')">☁️ Nuvens</button>
            <button class="layer-btn" onclick="changeMapLayer('cape')">⚡ Temporais / CAPE</button>
        </div>
    </div>
    <iframe id="ventusky-map" src="https://www.ventusky.com/?p=-22.73;-47.65;9&l=rain"></iframe>
</div>

<script>
    let currentLat = -22.7253;
    let currentLon = -47.6492;
    let currentLayer = 'rain';

    function updateMapIframe() {
        const iframe = document.getElementById('ventusky-map');
        iframe.src = `https://www.ventusky.com/?p=${currentLat.toFixed(2)};${currentLon.toFixed(2)};9&l=${currentLayer}`;
    }

    function changeMapLayer(layer) {
        currentLayer = layer;
        document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        updateMapIframe();
    }

    async function getCityName(lat, lon) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
            const data = await response.json();
            if (data && data.address) {
                const city = data.address.city || data.address.town || data.address.village || data.address.municipality || "Local Selecionado";
                const state = data.address.state ? `, ${data.address.state_code || data.address.state}` : "";
                return `${city}${state}`;
            }
        } catch (e) {
            console.error("Erro no Reverse Geocoding:", e);
        }
        return `Coordenadas: ${lat.toFixed(2)}, ${lon.toFixed(2)}`;
    }

    async function fetchWeatherData(lat, lon, name = "Piracicaba, SP") {
        currentLat = lat;
        currentLon = lon;

        document.getElementById("location-name").innerText = name;
        document.getElementById("banner-city").innerText = `📍 Cidade Selecionada: ${name}`;
        updateMapIframe();

        try {
            const res = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
            const result = await res.json();
            
            if (result.status === "success" && result.data && result.data.current) {
                const c = result.data.current;
                document.getElementById("temp").innerText = `${c.temperature_2m ?? "--"}°C`;
                document.getElementById("wind").innerText = `${c.wind_speed_10m ?? "--"} km/h`;
                document.getElementById("rain").innerText = `${c.precipitation ?? 0} mm`;
                document.getElementById("cape").innerText = `${c.cape ?? "--"} J/kg`;
                document.getElementById("pressure").innerText = `${c.surface_pressure ?? "--"} hPa`;

                if (result.data.hourly) {
                    renderChart(result.data.hourly);
                }
            }
        } catch (err) {
            console.error("Erro ao carregar clima:", err);
        }
    }

    async function searchLocation() {
        const query = document.getElementById("searchInput").value;
        if (!query) return;

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data && data.results && data.results.length > 0) {
                const city = data.results[0];
                const cityName = `${city.name}, ${city.admin1 || city.country}`;
                fetchWeatherData(city.latitude, city.longitude, cityName);
            }
        } catch (e) {
            console.error("Erro na busca de cidade:", e);
        }
    }

    let chartInstance = null;
    function renderChart(hourly) {
        const ctx = document.getElementById("forecastChart").getContext("2d");
        const labels = hourly.time.slice(0, 24).map(t => t.split("T")[1]);
        const temps = hourly.temperature_2m.slice(0, 24);

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Temperatura (°C)",
                    data: temps,
                    borderColor: "#38bdf8",
                    backgroundColor: "rgba(56, 189, 248, 0.1)",
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: "#94a3b8" } },
                    y: { ticks: { color: "#94a3b8" } }
                }
            }
        });
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const cityName = await getCityName(lat, lon);
                fetchWeatherData(lat, lon, cityName);
            });
        }
    }

    fetchWeatherData(-22.7253, -47.6492, "Piracicaba, SP");
</script>
</body>
</html>
