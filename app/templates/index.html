<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRATEMPO GLOBAL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1e293b; border-bottom: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .card h4 { margin: 0 0 10px 0; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
        .card .val { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
        .card .sub { font-size: 0.75rem; color: #64748b; margin-top: 5px; }
        #chart-container { background: #1e293b; margin: 0 20px 20px 20px; padding: 15px; border-radius: 10px; border: 1px solid #334155; height: 200px; }
        .map-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1e293b; margin: 0 20px; border-radius: 10px 10px 0 0; border: 1px solid #334155; border-bottom: none; }
        .layer-btn { background: #334155; color: #fff; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-left: 5px; }
        .layer-btn.active { background: #0284c7; border-color: #38bdf8; }
        #map { height: 650px !important; margin: 0 20px 20px 20px; border-radius: 0 0 10px 10px; border: 1px solid #334155; }
        .search-box { position: relative; width: 300px; }
        .search-box input { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
    </style>
</head>
<body>

<div class="header">
    <h2>🌪️ VRATEMPO GLOBAL</h2>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar qualquer cidade no mundo...">
    </div>
    <button onclick="getLocation()" style="background:#0284c7; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer;">📍 Minha Localização</button>
</div>

<div class="grid">
    <div class="card">
        <h4>Temperatura</h4>
        <div class="val" id="temp">--°C</div>
        <div class="sub" id="location-name">Carregando...</div>
    </div>
    <div class="card">
        <h4>Vento / Rajadas</h4>
        <div class="val" id="wind">-- km/h</div>
        <div class="sub" id="wind-sub">--</div>
    </div>
    <div class="card">
        <h4>Chuva / Acumulado</h4>
        <div class="val" id="rain">0.0 mm</div>
        <div class="sub">Sem chuva</div>
    </div>
    <div class="card">
        <h4>CAPE (Instabilidade)</h4>
        <div class="val" id="cape">-- J/kg</div>
        <div class="sub">Estável</div>
    </div>
    <div class="card">
        <h4>Pressão Atmosférica</h4>
        <div class="val" id="pressure">-- hPa</div>
        <div class="sub">Superfície</div>
    </div>
</div>

<div id="chart-container">
    <canvas id="forecastChart"></canvas>
</div>

<div class="map-header">
    <span style="font-size: 0.9rem; font-weight: bold; color: #94a3b8;">Monitor Global em Tempo Real</span>
    <div>
        <button class="layer-btn active" onclick="setLayer('base')">🗺️ Mapa Base</button>
        <button class="layer-btn" onclick="setLayer('clouds')">☁️ Satélite IR (Nuvens)</button>
        <button class="layer-btn" onclick="setLayer('precipitation')">🌧️ Radar Precipitação</button>
    </div>
</div>

<div id="map"></div>

<script>
    let map = L.map("map").setView([-22.7253, -47.6492], 9);
    
    // Camadas de mapa
    const baseLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
    const cloudsLayer = L.tileLayer("https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=b1b15e88fa797225412429c1c50c122a1", { opacity: 0.7 });
    const precipLayer = L.tileLayer("https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=b1b15e88fa797225412429c1c50c122a1", { opacity: 0.7 });

    function setLayer(type) {
        map.removeLayer(cloudsLayer);
        map.removeLayer(precipLayer);
        
        document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
        
        if (type === 'clouds') {
            cloudsLayer.addTo(map);
            event.target.classList.add('active');
        } else if (type === 'precipitation') {
            precipLayer.addTo(map);
            event.target.classList.add('active');
        } else {
            event.target.classList.add('active');
        }
    }

    let marker = L.marker([-22.7253, -47.6492]).addTo(map);

    map.on("click", function(e) {
        let lat = e.latlng.lat;
        let lon = e.latlng.lng;
        marker.setLatLng([lat, lon]);
        fetchWeatherData(lat, lon, `Coordenadas: ${lat.toFixed(2)}, ${lon.toFixed(2)}`);
    });

    async function fetchWeatherData(lat, lon, name = "Local Selecionado") {
        document.getElementById("location-name").innerText = name;
        try {
            const res = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
            const result = await res.json();
            
            if (result.status === "success" && result.data && result.data.current) {
                const c = result.data.current;
                document.getElementById("temp").innerText = `${c.temperature_2m ?? "--"}°C`;
                document.getElementById("wind").innerText = `${c.wind_speed_10m ?? "--"} km/h`;
                document.getElementById("rain").innerText = `${c.precipitation ?? 0} mm`;
                document.getElementById("cape").innerText = `${c.cape ?? "--"} J/kg`;
                document.getElementById("pressure").innerText = `${c.surface_pressure ?? "--"} hPa`;

                if (result.data.hourly) {
                    renderChart(result.data.hourly);
                }
            }
        } catch (err) {
            console.error("Erro ao carregar clima:", err);
        }
    }

    let chartInstance = null;
    function renderChart(hourly) {
        const ctx = document.getElementById("forecastChart").getContext("2d");
        const labels = hourly.time.slice(0, 24).map(t => t.split("T")[1]);
        const temps = hourly.temperature_2m.slice(0, 24);

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Temperatura (°C)",
                    data: temps,
                    borderColor: "#38bdf8",
                    backgroundColor: "rgba(56, 189, 248, 0.1)",
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: "#94a3b8" } },
                    y: { ticks: { color: "#94a3b8" } }
                }
            }
        });
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                map.setView([lat, lon], 11);
                marker.setLatLng([lat, lon]);
                fetchWeatherData(lat, lon, "Minha Localização");
            });
        }
    }

    fetchWeatherData(-22.7253, -47.6492, "Piracicaba, SP");
</script>
</body>
</html>
